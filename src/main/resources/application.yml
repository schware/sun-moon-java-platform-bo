server:
  port: 8080
  servlet:
    context-path: /bo
    session:
      cookie:
        http-only: true
        same-site: lax
        # Plain HTTP on the LAN for now; a Secure cookie would simply never
        # be sent. Must become true the moment BO is served over TLS.
        secure: false

spring:
  application:
    name: sun-moon-java-platform-bo
  datasource:
    url: jdbc:postgresql://localhost:5432/bo_service
    username: sunmoon
    password: sunmoon_dev_pw
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always

# The first 전체 관리자. Seeded only when the operator table is empty, and
# never with a guessable default - unset means "seed nothing and say so".
bo:
  admin:
    username: ${BO_ADMIN_USERNAME:}
    password: ${BO_ADMIN_PASSWORD:}
  # The two services BO reads and never writes: 매출 settles in Order, and
  # only the Device Server knows which terminals are connected. Both
  # default to the deploy server's layout, where every container runs with
  # --network host - so these are localhost, and Order carries its own
  # /order context path.
  order:
    base-url: ${ORDER_SERVICE_URL:http://localhost:8083/order}
  device-server:
    base-url: ${DEVICE_SERVER_URL:http://localhost:8087}
  # 테이블 QR이 담을 주소의 앞부분. 뒤에 테이블의 코드가 붙습니다.
  #
  # **손님 휴대폰이 LTE로 여는 주소여야 합니다.** 여기에 192.168.x 를 넣고
  # 인쇄하면 매장에서만 열리고, 스티커는 회수가 안 됩니다. 인쇄 전에
  # /api/tables/{id}/qr-target 으로 눈으로 확인하세요.
  #
  # 도메인이 생기면 그때 바꿉니다 — 공인 IP는 언젠가 바뀌고, 그날 붙여둔
  # QR이 전부 죽습니다.
  qr:
    table-base-url: ${QR_TABLE_BASE_URL:http://211.217.183.232:8085/channel-order/t/}
